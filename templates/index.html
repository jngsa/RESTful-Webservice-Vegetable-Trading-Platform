<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POOSETRADES</title>

    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="/static/js/script.js" defer></script>
   
</head>
<body>
    <!-- Header-Bereich mit Logo und Konto-Button -->
    <header>
        <div class="logo">POOSETRADES</div>
        <button class="konto-button">KONTO</button>
    </header>
    <!-- Hauptinhalt -->
    <main>
        <!-- Suchleiste -->
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Suchen...">
            <button class="search-button">🔍</button>
        </div>
        
        <!-- POOSETRADES-Logo -->
        <div class="poosetrades-logo">POOSE TRADES</div>
      
        <!-- Container für Graph und Informationen -->
        <div class="content-container">
            <!-- Graph-Container -->
            <div class="graph-container">
                <!-- Hier würde der tatsächliche Graph eingefügt werden -->
                <p>Graph wird hier angezeigt</p>
            </div>
            
            <!-- Container für Preis und Aktionsbuttons -->
            <div class="info-container">
                <!-- Preisanzeige -->
                <div class="price">Preis: XXXX</div>
                
                <!-- Aktionsbuttons -->
                <div class="action-buttons">
                    <button class="action-button buy-button">Kaufen</button>
                    <button class="action-button sell-button">Verkaufen</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer mit Links -->
    <footer class="footer">
        <a href="#">Kontakt</a>
        <a href="#">Hilfe</a>
        <a href="#">POOSECOINS</a>
    </footer>
</body>
</html>
