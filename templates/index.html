<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POOSETRADES</title>
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>
    <div class="outer-container">
        <div class="left-border"></div>
        <div class="container">
            <header>
                <div class="logo">POOSETRADES</div>
                <a href="konto.html" class="konto-button">KONTO</a>
            </header>

            <main>
                <div class="logo-container">
                    <img src="desings/logo.png" alt="POOSE TRADES" class="logo-image">
                </div>
                <div class="such-container">
                        <input type="text" class="such-input" placeholder="Suchen...">
                </div>
                <div class="content-wrapper">
                    <div class="graph-container">
                        <p>Graph wird hier angezeigt</p>
                    </div>
                    <div class="handel-container">
                        <div class="price-info">
                            <span>Preis: <span class="price-value">0</span></span>
                            <div class="available-units"><span class="units-value">0</span> verfügbar</div>
                        </div>
                        <div class="action-buttons">
                            <div class="buy-container">
                                <button class="action-button buy-button">
                                    <img src="desings/kaufen.png" alt="Kaufen">
                                </button>
                                <input type="number" class="buy-amount" min="1" value="1">
                            </div>
                            <div class="sell-container">
                                <button class="action-button sell-button">
                                    <img src="desings/verkaufen.png" alt="Verkaufen">
                                </button>
                                <input type="number" class="sell-amount" min="1" value="1">
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <footer class="footer">
                <div class="footer-links">
                    <button class="footer-button">Hilfe</button>
                    <button class="footer-button">Kontakt</button>
                </div>
                <div class="copyright">
                    &copy; POOSETRADES
                </div>
            </footer>
        </div>
        <div class="right-border"></div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
